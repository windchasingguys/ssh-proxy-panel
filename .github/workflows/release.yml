name: release

# 打 tag（v1.0.0 这种）时自动构建 Windows 单文件 exe 并挂到 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 ssh-proxy.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装打包工具（esbuild / postject）
        run: npm ci

      - name: 打包（Node SEA + csc 托盘）
        run: node scripts/build-exe.mjs

      - name: 冒烟验证产物
        shell: pwsh
        run: |
          # --prepare 会解包并自检（缺文件时不会打出 "ok"）。
          # 不要依赖 $env:LOCALAPPDATA：runner 上那个变量并不总等于 exe 看到的目录。
          $out = & .\dist\ssh-proxy.exe --prepare 2>&1 | Out-String
          Write-Host $out.Trim()
          $lines = $out -split "\r?\n"
          if ($lines -notcontains 'ok') { throw "解包自检没有通过（输出里没有 ok）" }

          $core = $null
          foreach ($line in $lines) {
            if ($line -match '^\s*core:\s*(.+)$') { $core = $Matches[1].Trim(); break }
          }
          if (-not $core) { throw "输出里没有 core 路径" }
          if (-not (Test-Path -LiteralPath $core)) { throw "控制器不存在: $core" }

          & $core version
          if ($LASTEXITCODE -ne 0) { throw "解包出来的控制器跑不起来（退出码 $LASTEXITCODE）" }
          Write-Host "产物自检通过：$core"

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ssh-proxy.exe
            dist/ssh-proxy-portable.zip
          generate_release_notes: true

      - name: 留一份构建产物（非 tag 触发时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ssh-proxy-windows
          path: |
            dist/ssh-proxy.exe
            dist/ssh-proxy-portable.zip
